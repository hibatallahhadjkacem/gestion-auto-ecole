<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenStreetMap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    let map = L.map('map').setView([0, 0], 2); // Valeur initiale neutre

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let marker = null;

    // Fonction que Java peut appeler pour afficher une localisation
    function setLocation(lat, lng, address = "Location") {
        const position = [lat, lng];
        map.setView(position, 13);

        if (marker) {
            map.removeLayer(marker);
        }

        marker = L.marker(position).addTo(map);
        marker.bindPopup(address).openPopup();
    }

    // Expose cette fonction pour JavaFX WebView
    window.setLocation = setLocation;

</script>
</body>
</html>
